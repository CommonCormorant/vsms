<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RetroTerm</title>
    <link rel="icon" type="image/png" sizes="16x16" href="https://www.gameship.online/info/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://www.gameship.online/info/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="https://www.gameship.online/info/favicon-48.png">
    <link rel="shortcut icon" href="https://www.gameship.online/info/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
    <div id="app-container">
        <div id="chat-output"></div>
        <div id="reaction-widget" class="hidden">
             <!-- Reactions will be populated by script.js -->
        </div>
        <div id="art-widget" class="hidden">
            <!-- Art widget will be loaded here -->
        </div>
        <div id="p-art-widget" class="widget hidden">
            <small>Simple markup is supported, such as *italics*, **bold** and _underline_</small>
            <textarea id="p-art-textarea"></textarea>
            <button id="p-art-clear">Clear</button>
            <button id="p-art-send">Send</button>
        </div>
        <form id="chat-form">
            <button type="button" id="art-button" aria-label="Send art">
                <span class="art-rect">▯</span>
                <span class="art-circle">○</span>
                <span class="art-triangle">▲</span>
            </button>
            <button type="button" id="p-art-button" class="chat-tool-button" title="Send a formatted paragraph">¶<i>t</i></button>
            <button type="button" id="reaction-button" aria-label="Send reaction">
                <span class="smiley">☺</span>
                <span class="heart">♡</span>
            </button>
            <input type="text" id="chat-input" placeholder="Type a message or /command..." autocomplete="off" autofocus>
            <button type="submit" id="send-button">➤ Send</button>
        </form>
    </div>
    <script src="script.js"></script>
    <script src="client.js"></script>
</body>
</html>
