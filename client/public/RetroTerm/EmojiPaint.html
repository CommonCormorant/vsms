<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Art Widget</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            overflow: hidden;
        }
        .widget-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .tool-section {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px;
        }
        .tools {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .tool-btn {
            padding: 8px;
            background: rgba(255,255,255,0.2);
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }
        .tool-btn.active {
            border-color: #fff;
            background: rgba(255,255,255,0.4);
        }
        .custom-emoji-input {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .custom-emoji-input input {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 14px;
        }
        .custom-emoji-preview {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.2);
            border: 2px solid transparent;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }
        .custom-emoji-preview.selected {
            border-color: #fff;
        }
        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .canvas {
            display: grid;
            gap: 1px;
            background: rgba(0,0,0,0.2);
            padding: 5px;
            border-radius: 5px;
        }
        .canvas-cell {
            width: 22px;
            height: 22px;
            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="toolbar">
            <div class="tool-section">
                <div class="tools">
                    <div class="tool-btn" data-tool="brush" title="Brush Tool">🖌️</div>
                    <div class="tool-btn" data-tool="fill" title="Fill Tool">🪣</div>
                    <div class="tool-btn" data-tool="eraser" title="Eraser">🧽</div>
                </div>
            </div>
            <div class="tool-section">
                <div class="custom-emoji-input">
                    <input type="text" id="customEmojiInput" placeholder="Paste emoji..." maxlength="2">
                    <div class="custom-emoji-preview" id="customEmojiPreview" title="Click to select custom emoji"></div>
                </div>
            </div>
        </div>
        <div class="canvas-container">
            <div class="canvas" id="canvas"></div>
            <div class="actions">
                <button class="btn" onclick="clearCanvas()">Clear</button>
                <button class="btn" onclick="exportArt()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const canvasEl = document.getElementById('canvas');
        const customEmojiInputEl = document.getElementById('customEmojiInput');
        const customEmojiPreviewEl = document.getElementById('customEmojiPreview');
        const toolBtns = document.querySelectorAll('.tool-btn');

        // --- State ---
        let currentTool = 'brush';
        let selectedEmoji = '⬜';
        let canvasData = [];
        const canvasWidth = 12;
        const canvasHeight = 6;
        let isMouseDown = false;
        const EMPTY_EMOJI = '⬜';

        // --- Functions ---

        function selectTool(tool) {
            currentTool = tool;
            toolBtns.forEach(btn => {
                if (btn.dataset.tool === tool) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function updateCanvasUI() {
            for (let y = 0; y < canvasHeight; y++) {
                for (let x = 0; x < canvasWidth; x++) {
                    const cell = canvasEl.querySelector(`[data-x="${x}"][data-y="${y}"]`);
                    if (cell) {
                        cell.textContent = canvasData[y][x];
                    }
                }
            }
        }

        function clearCanvas() {
            canvasData = Array(canvasHeight).fill(null).map(() => Array(canvasWidth).fill(EMPTY_EMOJI));
            updateCanvasUI();
        }

        function handleCellInteraction(x, y) {
            if (x < 0 || x >= canvasWidth || y < 0 || y >= canvasHeight) return;

            let emojiToApply;
            if (currentTool === 'brush') {
                emojiToApply = selectedEmoji;
            } else if (currentTool === 'eraser') {
                emojiToApply = EMPTY_EMOJI;
            } else {
                return; // Not a drawing tool
            }

            if (canvasData[y][x] !== emojiToApply) {
                canvasData[y][x] = emojiToApply;
                const cell = canvasEl.querySelector(`[data-x="${x}"][data-y="${y}"]`);
                cell.textContent = emojiToApply;
            }
        }

        function floodFill(x, y, targetEmoji, replacementEmoji) {
            if (x < 0 || x >= canvasWidth || y < 0 || y >= canvasHeight) return;
            if (!replacementEmoji || canvasData[y][x] !== targetEmoji || targetEmoji === replacementEmoji) {
                return;
            }

            canvasData[y][x] = replacementEmoji;

            floodFill(x + 1, y, targetEmoji, replacementEmoji);
            floodFill(x - 1, y, targetEmoji, replacementEmoji);
            floodFill(x, y + 1, targetEmoji, replacementEmoji);
            floodFill(x, y - 1, targetEmoji, replacementEmoji);
        }

        function createCanvas() {
            canvasEl.innerHTML = '';
            canvasEl.style.gridTemplateColumns = `repeat(${canvasWidth}, 1fr)`;

            for (let y = 0; y < canvasHeight; y++) {
                for (let x = 0; x < canvasWidth; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'canvas-cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;

                    cell.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        isMouseDown = true;
                        if (currentTool === 'fill') {
                            const targetEmoji = canvasData[y][x];
                            floodFill(x, y, targetEmoji, selectedEmoji);
                            updateCanvasUI();
                        } else {
                            handleCellInteraction(x, y);
                        }
                    });

                    cell.addEventListener('mouseenter', () => {
                        if (isMouseDown) {
                            handleCellInteraction(x, y);
                        }
                    });

                    canvasEl.appendChild(cell);
                }
            }
            clearCanvas(); // Initialize canvas with empty data and UI
        }

        function exportArt() {
            let output = '';
            for (let y = 0; y < canvasHeight; y++) {
                output += canvasData[y].join('');
                if (y < canvasHeight - 1) {
                    output += '¶';
                }
            }
            if (window.parent && typeof window.parent.sendArt === 'function') {
                window.parent.sendArt(output);
            } else {
                console.error('sendArt function not found on parent window.');
                navigator.clipboard.writeText(output).then(() => console.log('Art copied to clipboard.'));
            }
        }

        function updatePreview(emoji) {
            selectedEmoji = emoji || EMPTY_EMOJI;
            customEmojiPreviewEl.textContent = selectedEmoji;
            if (selectedEmoji !== EMPTY_EMOJI) {
                customEmojiPreviewEl.classList.add('selected');
            } else {
                customEmojiPreviewEl.classList.remove('selected');
            }
        }

        // --- Event Listeners & Initialization ---

        customEmojiInputEl.addEventListener('input', (e) => {
            updatePreview(e.target.value.trim());
        });

        customEmojiPreviewEl.addEventListener('click', () => {
             // Re-select the emoji in the preview, useful if tool was changed
             updatePreview(customEmojiPreviewEl.textContent);
        });

        toolBtns.forEach(btn => {
            btn.addEventListener('click', () => selectTool(btn.dataset.tool));
        });

        document.addEventListener('mouseup', () => {
            isMouseDown = false;
        });

        function initialize() {
            createCanvas();
            selectTool('brush');
            updatePreview(EMPTY_EMOJI);
        }

        initialize();

    </script>
</body>
</html>
