<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="16x16" href="https://www.gameship.online/info/favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://www.gameship.online/info/favicon-32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="https://www.gameship.online/info/favicon-48.png">
    <link rel="shortcut icon" href="https://www.gameship.online/info/favicon.ico">
    <title>GameShip.online - vsms Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h3>GameShip.online</h3>
        <div class="subtitle">vsms Authentication Part 2</div>

        <div class="instructions">
            Enter the name exactly as you provided in part 1 to complete authentication.
        </div>

        <div class="form-group">
            <label for="token">Your Token</label>
            <div class="token-display" id="token"></div>
        </div>

        <div class="form-group">
            <label for="username">Name</label>
            <input type="text" id="username" placeholder="Enter your name">
        </div>

        <button class="btn-primary" id="authBtn">Authenticate</button>
    </div>
  <script src="script.js"></script>
</body>
</html>
